<svg xmlns="http://www.w3.org/2000/svg" width="600" height="126" viewBox="0 0 600 126" role="img" aria-label="The best way to predict the future is to invent it. (Alan Kay) Never stop learning, because life never stops teaching. Let's collaborate and build something cool together."><rect x="0" y="4" width="3" height="50" rx="1.5" fill="#2dd4bf"/><text x="18" y="27" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#e6edf3">“The best way to predict the future is to invent it.”</text><text x="18" y="50" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#2dd4bf">— Alan Kay</text><text x="0" y="92" xml:space="preserve" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#9da7b3"><tspan font-weight="400">Never stop </tspan><tspan font-weight="600">learning</tspan><tspan font-weight="400">, because life never stops </tspan><tspan font-weight="600">teaching</tspan><tspan font-weight="400">.</tspan></text><text x="0" y="118" xml:space="preserve" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#9da7b3"><tspan font-weight="400">Let's collaborate and </tspan><tspan font-weight="600">build</tspan><tspan font-weight="400"> something </tspan><tspan font-weight="600">cool</tspan><tspan font-weight="400"> together.</tspan></text></svg>